<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Spend">
<title>Daily Spend</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#13302B; --muted:#5E716C; --line:#D9E2DD;
  --accent:#D99A0B; --accent-ink:#241A00; --bad:#B8402A; --track:#E1E9E4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1B19; --surface:#172623; --ink:#E4EEEA; --muted:#93A6A0; --line:#263A35;
    --accent:#F0B429; --accent-ink:#1F1600; --bad:#F0775E; --track:#22332F;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:440px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,p{margin:0}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 8px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.top .date{font-weight:600}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

.hero{margin-bottom:26px}
.lead{color:var(--muted);font-size:15px}
.big{font-size:clamp(58px,19vw,88px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:6px 0 16px;word-break:break-all}
.big .cur{font-size:.26em;font-weight:600;letter-spacing:0;margin-right:.35em;vertical-align:.95em;color:var(--muted)}
.big.bad{color:var(--bad)}
.bar{height:14px;border-radius:7px;background:var(--track);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .35s ease}
.bar.bad span{background:var(--bad)}
.sub{margin-top:10px;color:var(--muted);font-size:15px}
.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(.96)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.card.note{border-color:var(--accent)}
.card.note p{margin-bottom:12px}
.amount{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.amount:focus-within{border-color:var(--accent)}
.amount span{color:var(--muted);font-weight:600}
.amount input{flex:1;min-width:0;border:0;background:none;font-size:32px;font-weight:800;padding:4px 0;outline:none}
.text{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:16px}
.primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px}
.primary:active{transform:translateY(1px)}
.ghost{border:1px solid var(--line);background:none;border-radius:12px;padding:10px 14px;font-weight:600}
.err{color:var(--bad);font-size:14px;margin:-4px 0 10px}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .what{flex:1;min-width:0}
.list .what b{display:block;font-weight:600}
.list .what span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.list time{color:var(--muted);font-size:14px;text-align:right}
.del{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px;border-radius:8px}
.empty{color:var(--muted);font-size:15px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.facts span,.row span{display:block;color:var(--muted);font-size:13px}
.facts b{font-size:19px}
.facts b.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row b{font-size:22px}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.editor{margin-top:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .primary{flex:1;width:auto}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:200px;border:0;background:none;border-radius:12px;padding:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--bg);color:var(--ink)}

.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.center h1{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1}
.tag{color:var(--muted);margin:10px 0 28px;font-size:17px}
label{display:block;font-weight:600;margin-bottom:6px}
.fine{color:var(--muted);font-size:13px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="today">Today</button>
  <button data-tab="hand">In hand</button>
</nav>

<script type="module">
// ===================== PASTE YOUR FIREBASE CONFIG HERE =====================
const firebaseConfig = {
  apiKey: "AIzaSyC2NSMdpNp0inuIxB3WdeAw5Xzkm3UP14o",
  authDomain: "daily-spend-11e67.firebaseapp.com",
  projectId: "daily-spend-11e67",
  storageBucket: "daily-spend-11e67.firebasestorage.app",
  messagingSenderId: "1064647211023",
  appId: "1:1064647211023:web:5efd244d79933cbfe80b7a"
};
// ===========================================================================
const FAMILY = 'family';                 // everyone shares this one budget
const EMAIL_DOMAIN = '@dailyspend.app';  // username "sudeepa" logs in as sudeepa@dailyspend.app

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, onSnapshot, addDoc, deleteDoc, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const configured = !String(firebaseConfig.apiKey).startsWith('PASTE');
let auth, db, famRef, entriesRef;
let me = null, authReady = false, entries = [], limit = null, limitBy = null;
let loaded = { fam: false, ent: false }, unsub = [], loadError = '';
let tab = 'today', editingLimit = false, bump = false, lastDay = dayStr(), loginErr = '', busy = false;

function dayStr(d = new Date()){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const fmt = n => new Intl.NumberFormat('en-LK', { maximumFractionDigits: 2 }).format(n);
const money = n => 'LKR ' + fmt(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseAmt(v){ const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) && n > 0 ? Math.round(n*100)/100 : null; }
function readLocal(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function writeLocal(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const saveFail = e => alert('Could not save: ' + (e.code === 'permission-denied' ? 'this account is not allowed. Check your Firestore rules.' : e.message));

if(configured){
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch(e){ db = getFirestore(app); }
  famRef = doc(db, 'families', FAMILY);
  entriesRef = collection(db, 'families', FAMILY, 'entries');

  onAuthStateChanged(auth, u => {
    unsub.forEach(f => f()); unsub = [];
    authReady = true;
    me = u ? u.email.split('@')[0] : null;
    entries = []; limit = null; limitBy = null; loaded = { fam: false, ent: false }; loadError = '';
    if(u){
      unsub.push(onSnapshot(famRef, s => {
        const d = s.data() || {}; limit = d.limit ?? null; limitBy = d.limitBy || null; loaded.fam = true; render();
      }, onLoadErr));
      unsub.push(onSnapshot(entriesRef, s => {
        entries = s.docs.map(d => ({ id: d.id, ...d.data() })); loaded.ent = true; render();
      }, onLoadErr));
    }
    render();
  });
}
function onLoadErr(e){
  loadError = e.code === 'permission-denied'
    ? 'This account can’t open the family budget yet. Check that its email is listed in your Firestore rules.'
    : 'Couldn’t load the family budget: ' + e.message;
  render();
}

function totals(){
  const t = dayStr(), month = t.slice(0,7);
  const sum = arr => arr.reduce((s,x) => s + (x.amount || 0), 0);
  const spends = entries.filter(x => x.type === 'spend'), adds = entries.filter(x => x.type === 'add');
  const todays = spends.filter(x => x.date === t).sort((a,b) => b.ts - a.ts);
  const spentToday = sum(todays);
  const inHand = sum(adds) - sum(spends);
  const now = new Date();
  const daysLeft = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() - now.getDate() + 1;
  return {
    todays, spentToday, inHand, daysLeft, adds: adds.sort((a,b) => b.ts - a.ts),
    suggested: Math.max(0, Math.floor((inHand + spentToday) / daysLeft)),
    monthAdded: sum(adds.filter(x => x.date.startsWith(month))),
    monthSpent: sum(spends.filter(x => x.date.startsWith(month)))
  };
}

// Data saved on this phone by the earlier one-phone version of the app
function oldLocalData(){
  if(!me) return null;
  const d = readLocal('dailyspend:user:' + me);
  if(!d || d.imported || !((d.incomes || []).length || (d.expenses || []).length)) return null;
  return d;
}
function importOld(){
  const d = oldLocalData(); if(!d) return;
  const b = writeBatch(db);
  (d.incomes || []).forEach(x => b.set(doc(entriesRef), { type:'add', amount:x.amount, note:x.note || '', date:x.date, ts:x.ts, by:me }));
  (d.expenses || []).forEach(x => b.set(doc(entriesRef), { type:'spend', amount:x.amount, note:x.note || '', date:x.date, ts:x.ts, by:me }));
  if(limit == null && d.limit) b.set(famRef, { limit:d.limit, limitBy:me, limitAt:Date.now() }, { merge:true });
  b.commit().catch(saveFail);
  d.imported = true; writeLocal('dailyspend:user:' + me, d);
  render();
}
function skipOld(){ const d = oldLocalData(); if(d){ d.imported = true; writeLocal('dailyspend:user:' + me, d); } render(); }

function header(title){
  return `<header class="top"><div class="date">${title}</div>
    <button class="link" data-act="logout">${esc(me)}, log out</button></header>`;
}
function whoWhen(x, withDate){
  const when = withDate
    ? new Date(x.ts).toLocaleDateString('en-GB', { day:'numeric', month:'short' })
    : new Date(x.ts).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  return `${when}<br>${esc(x.by)}`;
}
function itemList(items, kind, withDate){
  return `<ul class="list">${items.map(x => `
    <li><div class="what"><b>${money(x.amount)}</b>${x.note ? `<span>${esc(x.note)}</span>` : ''}</div>
      <time>${whoWhen(x, withDate)}</time>
      <button class="del" data-del="${x.id}" data-kind="${kind}" aria-label="Delete this entry">×</button></li>`).join('')}</ul>`;
}

function todayView(){
  const t = totals(), lim = limit;
  const dateLabel = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  const old = oldLocalData();
  const importCard = old ? `<section class="card note">
    <p>This phone has entries you saved before the app was shared. Move them into the family budget?</p>
    <div class="btns"><button class="primary" data-act="importOld">Move my entries</button>
    <button class="ghost" data-act="skipOld">Leave them</button></div></section>` : '';
  let hero;
  if(lim == null){
    hero = `<section class="hero"><p class="lead">Set a daily limit to start</p>
      <p class="sub">Pick an amount below. Anyone in the family can change it.</p></section>`;
  } else {
    const left = lim - t.spentToday, over = left < 0;
    const pct = lim > 0 ? Math.max(0, Math.min(100, left / lim * 100)) : 0;
    hero = `<section class="hero">
      <p class="lead">${over ? 'Over today’s limit by' : 'Left to spend today'}</p>
      <div class="big ${over ? 'bad' : ''} ${bump ? 'bump' : ''}"><span class="cur">LKR</span>${fmt(Math.abs(left))}</div>
      <div class="bar ${over ? 'bad' : ''}"><span style="width:${over ? 100 : pct}%"></span></div>
      <p class="sub">${money(t.spentToday)} spent of ${money(lim)}</p></section>`;
  }
  const spendForm = lim == null ? '' : `
    <form class="card" id="spendForm" novalidate>
      <div class="amount"><span>LKR</span><input id="spendAmt" inputmode="decimal" placeholder="0" aria-label="Amount spent" autocomplete="off"></div>
      <input class="text" id="spendNote" placeholder="What for? (optional)" maxlength="60" autocomplete="off">
      <p class="err" id="spendErr" hidden>Enter an amount above zero.</p>
      <button class="primary">Add spend</button>
    </form>`;
  const list = lim == null ? '' : `<section class="card"><h2>Today’s spending</h2>
    ${t.todays.length ? itemList(t.todays, 'spend', false) : `<p class="empty">Nothing spent yet today.</p>`}</section>`;
  const hint = t.inHand + t.spentToday > 0
    ? `Suggested: ${money(t.suggested)} a day. That spreads what you have in hand over the ${t.daysLeft} day${t.daysLeft > 1 ? 's' : ''} left this month.`
    : `Add money on the In hand screen to get a suggested limit.`;
  const editor = (editingLimit || lim == null) ? `
    <form class="editor" id="limitForm" novalidate>
      <div class="amount"><span>LKR</span><input id="limitAmt" inputmode="decimal" placeholder="0" aria-label="Daily limit" value="${lim ?? (t.suggested || '')}" autocomplete="off"></div>
      <p class="err" id="limitErr" hidden>Enter a limit above zero.</p>
      <div class="btns"><button class="primary">Save limit</button>
        ${t.suggested > 0 ? `<button type="button" class="ghost" data-act="useSuggested">Use ${money(t.suggested)}</button>` : ''}
        ${lim != null ? `<button type="button" class="ghost" data-act="cancelLimit">Cancel</button>` : ''}</div>
    </form>` : '';
  return header(dateLabel) + importCard + hero + spendForm + list + `
    <section class="facts">
      <div><span>In hand</span><b class="${t.inHand < 0 ? 'bad' : ''}">${money(t.inHand)}</b></div>
      <div><span>Days left this month</span><b>${t.daysLeft}</b></div>
    </section>
    <section class="card">
      <div class="row"><div><span>Daily limit${lim != null && limitBy ? `, set by ${esc(limitBy)}` : ''}</span><b>${lim == null ? 'Not set' : money(lim)}</b></div>
        ${lim != null && !editingLimit ? `<button class="ghost" data-act="editLimit">Change</button>` : ''}</div>
      <p class="hint">${hint}</p>${editor}
    </section>`;
}

function handView(){
  const t = totals();
  return header('In hand') + `
    <section class="hero">
      <p class="lead">In hand now</p>
      <div class="big ${t.inHand < 0 ? 'bad' : ''}"><span class="cur">LKR</span>${fmt(t.inHand)}</div>
      <p class="sub">Added ${money(t.monthAdded)} and spent ${money(t.monthSpent)} this month.</p>
    </section>
    <form class="card" id="incomeForm" novalidate>
      <div class="amount"><span>LKR</span><input id="incAmt" inputmode="decimal" placeholder="0" aria-label="Amount to add" autocomplete="off"></div>
      <input class="text" id="incNote" placeholder="Where from? (optional) e.g. Salary" maxlength="60" autocomplete="off">
      <p class="err" id="incErr" hidden>Enter an amount above zero.</p>
      <button class="primary">Add money</button>
    </form>
    <section class="card"><h2>Money added</h2>
      ${t.adds.length ? itemList(t.adds, 'add', true) : `<p class="empty">Add the money you have right now to get started.</p>`}
    </section>`;
}

function loginView(){
  return `<main class="center">
    <h1>Daily Spend</h1>
    <p class="tag">The family’s spending, one shared limit.</p>
    <form id="loginForm">
      <label for="uname">Username</label>
      <input class="text" id="uname" autocomplete="username" autocapitalize="none" autocorrect="off" maxlength="30" required>
      <label for="pass">Password</label>
      <input class="text" id="pass" type="password" autocomplete="current-password" required>
      ${loginErr ? `<p class="err">${esc(loginErr)}</p>` : ''}
      <button class="primary" ${busy ? 'disabled' : ''}>${busy ? 'Logging in…' : 'Log in'}</button>
    </form>
    <p class="fine">You stay logged in on this phone until you log out.</p>
  </main>`;
}
const msgView = (title, text, withLogout) => `<main class="center"><h1>${title}</h1><p class="tag">${text}</p>
  ${withLogout ? `<button class="ghost" data-act="logout">Log out</button>` : ''}</main>`;

function render(){
  const app = document.getElementById('app'), tabs = document.getElementById('tabs');
  // keep anything half-typed when the other phone's changes arrive
  const kept = {}; app.querySelectorAll('input[id]').forEach(i => { if(i.value) kept[i.id] = i.value; });
  const focusId = document.activeElement && document.activeElement.id;
  let html, showTabs = false;
  if(!configured) html = msgView('Almost there', 'Paste your Firebase config into index.html, near the top of the script, then upload it to GitHub again.');
  else if(!authReady) html = msgView('Daily Spend', 'Loading…');
  else if(!me) html = loginView();
  else if(loadError) html = msgView('Can’t open the budget', esc(loadError), true);
  else if(!loaded.fam || !loaded.ent) html = msgView('Daily Spend', 'Loading the family budget…');
  else { html = tab === 'today' ? todayView() : handView(); showTabs = true; }
  app.innerHTML = html;
  tabs.hidden = !showTabs;
  tabs.querySelectorAll('button').forEach(b => {
    if(b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  Object.entries(kept).forEach(([id, v]) => { const el = document.getElementById(id); if(el) el.value = v; });
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus(); }
  bump = false;
}

function addEntry(type, amtId, noteId, errId){
  const amtEl = document.getElementById(amtId), noteEl = document.getElementById(noteId);
  const amt = parseAmt(amtEl.value);
  if(!amt){ document.getElementById(errId).hidden = false; return; }
  const note = noteEl.value.trim();
  amtEl.value = ''; noteEl.value = ''; amtEl.blur(); noteEl.blur();
  addDoc(entriesRef, { type, amount: amt, note, date: dayStr(), ts: Date.now(), by: me }).catch(saveFail);
  if(type === 'spend') bump = true;
  render();
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if(f.id === 'loginForm'){
    const name = document.getElementById('uname').value.trim().toLowerCase();
    const pass = document.getElementById('pass').value;
    if(!name || !pass) return;
    busy = true; loginErr = ''; render();
    try { await signInWithEmailAndPassword(auth, name + EMAIL_DOMAIN, pass); }
    catch(err){
      loginErr = err.code === 'auth/network-request-failed' ? 'No internet connection. Try again when you’re online.'
        : err.code === 'auth/too-many-requests' ? 'Too many tries. Wait a few minutes and try again.'
        : 'That username or password is wrong.';
    }
    busy = false;
    const p = document.getElementById('pass'); if(p) p.value = '';
    render();
  }
  if(f.id === 'spendForm') addEntry('spend', 'spendAmt', 'spendNote', 'spendErr');
  if(f.id === 'incomeForm') addEntry('add', 'incAmt', 'incNote', 'incErr');
  if(f.id === 'limitForm'){
    const el = document.getElementById('limitAmt');
    const amt = parseAmt(el.value);
    if(!amt){ document.getElementById('limitErr').hidden = false; return; }
    el.value = ''; el.blur(); editingLimit = false;
    setDoc(famRef, { limit: amt, limitBy: me, limitAt: Date.now() }, { merge: true }).catch(saveFail);
    render();
  }
});

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ tab = b.dataset.tab; editingLimit = false; render(); window.scrollTo(0,0); return; }
  if(b.dataset.del){
    if(confirm(b.dataset.kind === 'spend' ? 'Delete this spend?' : 'Delete this entry?'))
      deleteDoc(doc(entriesRef, b.dataset.del)).catch(saveFail);
    return;
  }
  const act = b.dataset.act;
  if(act === 'logout'){ signOut(auth); tab = 'today'; }
  if(act === 'editLimit'){ editingLimit = true; render(); const el = document.getElementById('limitAmt'); if(el){ el.focus(); el.select(); } }
  if(act === 'cancelLimit'){ editingLimit = false; const el = document.getElementById('limitAmt'); if(el) el.value = ''; render(); }
  if(act === 'useSuggested'){
    const s = totals().suggested; editingLimit = false;
    const el = document.getElementById('limitAmt'); if(el) el.value = '';
    setDoc(famRef, { limit: s, limitBy: me, limitAt: Date.now() }, { merge: true }).catch(saveFail);
    render();
  }
  if(act === 'importOld') importOld();
  if(act === 'skipOld') skipOld();
});

// "Today" resets by date on its own; this refreshes the screen if the app stays open past midnight.
function checkDay(){ if(dayStr() !== lastDay){ lastDay = dayStr(); render(); } }
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkDay(); });

render();
</script>
</body>
